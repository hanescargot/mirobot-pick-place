<svg xmlns="http://www.w3.org/2000/svg" width="780" height="430" viewBox="0 0 780 430" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Segoe UI', sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="ac" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.6"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#1D9E75" stroke-width="1.6"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6"/></marker>
  </defs>
  <rect width="780" height="430" fill="#ffffff"/>

  <text x="30" y="34" font-size="18" font-weight="600" fill="#2C2C2A">Unit circle에서 rotation matrix 유도하기 (θ = 30°, 반시계 방향)</text>

  <!-- axes -->
  <line x1="30" y1="240" x2="390" y2="240" stroke="#B4B2A9" stroke-width="1"/>
  <line x1="210" y1="410" x2="210" y2="60" stroke="#B4B2A9" stroke-width="1"/>
  <circle cx="210" cy="240" r="150" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- original basis vectors -->
  <line x1="210" y1="240" x2="356" y2="240" stroke="#5F5E5A" stroke-width="2" marker-end="url(#ag)"/>
  <line x1="210" y1="240" x2="210" y2="94" stroke="#5F5E5A" stroke-width="2" marker-end="url(#ag)"/>
  <text x="364" y="262" font-size="14" fill="#5F5E5A">(1, 0)</text>
  <text x="218" y="80" font-size="14" fill="#5F5E5A">(0, 1)</text>

  <!-- rotated e1 (coral) -->
  <line x1="329.9" y1="165" x2="329.9" y2="240" stroke="#D85A30" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="210" y1="240" x2="327" y2="166.6" stroke="#D85A30" stroke-width="2.5" marker-end="url(#ac)"/>
  <circle cx="329.9" cy="165" r="4" fill="#D85A30"/>
  <text x="272" y="152" font-size="14" font-weight="600" fill="#993C1D">(cos θ, sin θ)</text>
  <text x="252" y="258" font-size="13" fill="#993C1D">cos θ</text>
  <text x="336" y="208" font-size="13" fill="#993C1D">sin θ</text>
  <path d="M 250 240 A 40 40 0 0 0 244.6 220" fill="none" stroke="#D85A30" stroke-width="1.5"/>
  <text x="256" y="230" font-size="13" fill="#993C1D">θ</text>

  <!-- rotated e2 (teal) -->
  <line x1="135" y1="110.1" x2="210" y2="110.1" stroke="#1D9E75" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="210" y1="240" x2="136.5" y2="112.7" stroke="#1D9E75" stroke-width="2.5" marker-end="url(#at)"/>
  <circle cx="135" cy="110.1" r="4" fill="#1D9E75"/>
  <text x="36" y="100" font-size="14" font-weight="600" fill="#085041">(−sin θ, cos θ)</text>
  <text x="150" y="104" font-size="13" fill="#085041">sin θ</text>
  <text x="216" y="140" font-size="13" fill="#085041">cos θ</text>
  <path d="M 210 200 A 40 40 0 0 0 190 205.4" fill="none" stroke="#1D9E75" stroke-width="1.5"/>
  <text x="190" y="196" font-size="13" fill="#085041">θ</text>

  <!-- right panel -->
  <line x1="420" y1="60" x2="420" y2="410" stroke="#D3D1C7" stroke-width="1"/>

  <text x="445" y="80" font-size="15" font-weight="600" fill="#2C2C2A">1. 기본 화살표가 도착한 곳</text>
  <text x="445" y="106" font-size="14" fill="#993C1D">(1, 0) → (cos θ, sin θ)</text>
  <text x="445" y="128" font-size="14" fill="#085041">(0, 1) → (−sin θ, cos θ)</text>

  <text x="445" y="168" font-size="15" font-weight="600" fill="#2C2C2A">2. 세로줄(column)로 세우기</text>
  <text x="445" y="206" font-size="16" fill="#2C2C2A">R(θ) =</text>
  <text x="508" y="216" font-size="44" fill="#5F5E5A">[</text>
  <text x="530" y="200" font-size="16" fill="#993C1D">cos θ</text>
  <text x="530" y="226" font-size="16" fill="#993C1D">sin θ</text>
  <text x="600" y="200" font-size="16" fill="#085041">−sin θ</text>
  <text x="604" y="226" font-size="16" fill="#085041">cos θ</text>
  <text x="664" y="216" font-size="44" fill="#5F5E5A">]</text>
  <text x="530" y="250" font-size="12" fill="#993C1D">column 1</text>
  <text x="600" y="250" font-size="12" fill="#085041">column 2</text>

  <text x="445" y="290" font-size="15" font-weight="600" fill="#2C2C2A">3. 왜 되는가?</text>
  <text x="445" y="314" font-size="13" fill="#444441">(x, y) = x·(1, 0) + y·(0, 1) 이므로</text>
  <text x="445" y="334" font-size="13" fill="#444441">R·(x, y) = x·column 1 + y·column 2</text>

  <text x="445" y="372" font-size="15" font-weight="600" fill="#2C2C2A">4. 시계 방향(CW): θ → −θ</text>
  <text x="445" y="398" font-size="14" fill="#444441">R_cw(θ) = [[cos θ, sin θ], [−sin θ, cos θ]]</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
